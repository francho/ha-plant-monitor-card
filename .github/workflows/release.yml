name: Create release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4

      - name: Validate the version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the v<major>.<minor> format (for example, v1.0)."
            exit 1
          fi

      - name: Build the Home Assistant archive
        run: |
          rm -rf release
          mkdir release
          cp -R src/. release/
          (
            cd release
            zip -r ../fch-plant-monitor-card.zip .
          )

      - name: Verify the archive
        run: unzip -l fch-plant-monitor-card.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" fch-plant-monitor-card.zip \
            --title "$TAG" \
            --generate-notes